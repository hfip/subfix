<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="subfix running in a terminal">
  <title>subfix running in a terminal</title>
  <rect width="1280" height="300" fill="#0c111d"/>

  <rect x="40" y="34" width="1200" height="232" rx="14" fill="#131b2c" stroke="#26314a"/>
  <circle cx="68" cy="64" r="5.5" fill="#f87171"/>
  <circle cx="88" cy="64" r="5.5" fill="#fbbf24"/>
  <circle cx="108" cy="64" r="5.5" fill="#34d399"/>
  <text x="132" y="69" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#5b6b86">subfix — ~/Movies/Subs</text>
  <path d="M40 86h1200" stroke="#26314a"/>

  <g font-family="'SF Mono', Menlo, Consolas, monospace">
    <text x="68" y="122" font-size="16" fill="#7dd3fc">$ subfix -r ~/Movies/Subs</text>
    <text x="68" y="154" font-size="14" fill="#8fa3bf">  + movie.srt      cp1256 &#8594; utf-8   ads 2   timing 1</text>
    <text x="68" y="180" font-size="14" fill="#8fa3bf">  + episode-01.srt  ok                   rtl 14</text>
    <text x="68" y="206" font-size="14" fill="#48566d">  = bonus.srt      already clean</text>
    <text x="68" y="240" font-size="13" fill="#3f4c60">  2 fixed, 1 clean, 0 failed</text>
  </g>

  <text x="1210" y="244" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="40" fill="#dbe4f3">sub<tspan fill="#38bdf8">fix</tspan></text>
</svg>
