[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "subfix"
version = "0.1.1"
description = "Fix broken Arabic subtitles in one command: encoding, timing, RTL and ad lines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abdulluh.X", email = "199844698+hfip@users.noreply.github.com" }]
keywords = [
    "subtitles",
    "srt",
    "arabic",
    "rtl",
    "encoding",
    "mojibake",
    "cli",
    "media",
    "infuse",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
subfix = "subfix.cli:main"

[project.urls]
Homepage = "https://github.com/hfip/subfix"
Repository = "https://github.com/hfip/subfix"
Issues = "https://github.com/hfip/subfix/issues"
Changelog = "https://github.com/hfip/subfix/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/subfix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
